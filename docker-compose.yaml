services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=dash.airobotika.com
      - PUID=1000
      - PGID=1000
    ports:
      - "3200:3000"
    volumes:
      - /home/csiszi/homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
